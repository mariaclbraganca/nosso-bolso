name: envelope_flutter_v2
description: "Nosso Bolso v2 — redesign completo com design system premium"
publish_to: 'none'
version: 2.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.5.1
  supabase_flutter: ^2.5.0
  http: ^1.2.1
  intl: ^0.19.0
  fl_chart: ^0.68.0
  google_fonts: ^6.1.0
  google_sign_in: ^6.2.1
  url_launcher: ^6.3.1
  image_picker: ^1.1.2
  shared_preferences: ^2.3.2
  flutter_secure_storage: ^9.2.2
  mobile_scanner: ^5.2.3
  flutter_local_notifications: ^17.2.4
  timezone: ^0.9.4
  flutter_notification_listener: ^1.4.0
  csv: ^6.0.0
  pdf: ^3.10.8
  printing: ^5.12.0
  path_provider: ^2.1.3
  share_plus: ^10.0.0
  sentry_flutter: ^8.9.0
  package_info_plus: ^8.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true

